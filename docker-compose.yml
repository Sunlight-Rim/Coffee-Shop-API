services:
  api:
    container_name: coffeeshop-api
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - 1337:1337
      - 6060:6060
    depends_on:
      - postgres
      - redis
      - prometheus
      - jaeger

  postgres:
    container_name: coffeeshop-postgres
    image: postgres
    environment:
      - POSTGRES_DB=coffeeshop
      - POSTGRES_USER=coffeeshop
      - POSTGRES_PASSWORD=coffeeshop
    ports:
      - 5432:5432
    # volumes:
    #   - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    container_name: coffeeshop-redis
    image: redis
    command: redis-server --user coffeeshop --requirepass coffeeshop
    ports:
      - 6379:6379
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf

  swagger-ui:
    container_name: coffeeshop-swagger
    image: swaggerapi/swagger-ui
    environment:
      - SWAGGER_JSON=/docs/swagger.json
      - WITH_CREDENTIALS=true
    ports:
      - 8080:8080
    volumes:
      - ./docs/swagger.json:/docs/swagger.json

  prometheus:
    container_name: coffeeshop-prometheus
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090
    command: --config.file=/etc/prometheus/prometheus.yml
  
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: coffeeshop-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4318:4318"